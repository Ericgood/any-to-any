name: CI macOS

# Opt-in macOS coverage (ADR-015). NOT on every push — macOS runners bill at
# 10x. Runs weekly and on demand so macOS-specific regressions in the unit
# suite (path handling, better-sqlite3 native build) are still caught, without
# taxing the account's shared Actions minutes on every commit.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node 22 / macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
